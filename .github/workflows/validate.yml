name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
    # hassfest absichtlich nicht hier: es scannt auch die Frontend-Plugin-
    # manifests (frontend/src/plugins/*/manifest.json), die keine HA-
    # Integrationen sind (kein codeowners) → False-Positive. hassfest ist
    # keine HACS-Default-Voraussetzung; die manifest-Prüfung deckt HACS ab.
